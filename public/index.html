<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}[hidden]{display:none!important}

/* Layout: one-column card-table scorepad; felt green as the table, card red for danger, everything thumb-sized */
:root{
  --bg:#eaefeb; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#15201a; --muted:#5b6a61; --line:#d3dcd6;
  --felt:#1d5a41; --felt-ink:#ffffff; --red:#c12a3a; --ok:#1d8a4b; --gold:#a8790a; --shade:rgba(10,20,15,.55);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#15201a; --surface-2:#1b2821; --ink:#e7eee9; --muted:#93a39a; --line:#27362d;
  --felt:#3fae7a; --felt-ink:#07130d; --red:#ff6b78; --ok:#4fd18b; --gold:#e8bb4f; --shade:rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#15201a; --surface-2:#1b2821; --ink:#e7eee9; --muted:#93a39a; --line:#27362d;
  --felt:#3fae7a; --felt-ink:#07130d; --red:#ff6b78; --ok:#4fd18b; --gold:#e8bb4f; --shade:rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--felt);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--felt);color:var(--felt-ink);border-color:transparent}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.muted{color:var(--muted)}
.note{font-size:14px;color:var(--muted)}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em;color:var(--felt);display:flex;align-items:flex-start}
.logo small{font-size:13px;font-family:var(--f-body);color:var(--muted);letter-spacing:0;font-weight:500;margin:6px 0 0 10px;line-height:1.3}
.suits{font-size:22px;letter-spacing:4px}
.suits .rd{color:var(--red)}

.list{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%}
.tcard .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tcard b{font-family:var(--f-display);font-weight:700;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.live{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-size:15px}
.board{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.board .r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:11px 16px;border-top:1px solid var(--line);align-items:center}
.board .r:first-child{border-top:0}
.board .pos{font-family:var(--f-display);font-weight:700;color:var(--muted)}
.board .r:first-child .pos{color:var(--gold)}

/* table view */
.top{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px;flex:none}
.top h1{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deal{background:var(--felt);color:var(--felt-ink);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.deal .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.deal .who{font-family:var(--f-display);font-size:22px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.deal .cards{grid-row:1/3;grid-column:2;text-align:center;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1}
.deal .cards span{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;opacity:.85;margin-top:4px}
.deal.win{background:var(--gold);color:#1a1405}

.players{display:flex;flex-direction:column;gap:8px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;align-items:center;position:relative}
.pl .st{grid-row:1/3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700}
.pl .st.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pl .st.out{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pl .st.crown{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.pl .nm{font-weight:600;font-size:17px;min-width:0;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pl.isout .nm .n{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.pl .sc{grid-row:1/3;grid-column:3;font-family:var(--f-display);font-weight:700;font-size:26px;text-align:right}
.pl.isout .sc{color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;grid-column:2}
.bar i{display:block;height:100%;background:var(--felt);border-radius:3px}
.bar i.hot{background:var(--gold)} .bar i.crit{background:var(--red)}
.nick{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.nick.th{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.dl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--felt);color:var(--felt-ink)}
.left{font-size:12px;color:var(--muted);grid-column:2}
.srow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.srow .sn{min-width:0;overflow-wrap:anywhere;font-weight:600;display:flex;flex-direction:column}
.srow .sn small{font-weight:400;font-size:12px;color:var(--muted)}
.srow.gone .sn>span{text-decoration:line-through;color:var(--muted)}
.srow .ar{width:44px;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:18px}
.srow .ar:disabled{opacity:.3}
.tog.rm{background:var(--red);color:#fff}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .wide{grid-column:1/-1}
.hist{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hist table{border-collapse:collapse;font-size:14px;min-width:100%}
.hist th,.hist td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.hist th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.hist td:first-child,.hist th:first-child{text-align:left;color:var(--muted)}
.hist td small{display:block;font-size:11px;color:var(--muted)}
.hist td.o{color:var(--red)} .hist td.z{color:var(--ok);font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--red) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:12px;padding:10px 12px}
.confirm span{flex:1;min-width:150px;font-size:14px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheet header h3{font-size:18px}
.sheet .x{width:40px;height:40px;border-radius:10px;background:var(--surface-2);font-size:18px}
.sheet .body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet footer{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px}
.chip.on{background:var(--felt);color:var(--felt-ink);border-color:transparent}
.chip.used{opacity:.4}
.chip.q{font-family:var(--f-display);font-weight:700}
.rd{color:var(--red)}
.chip.on .rd{color:inherit}

.stepper{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 0}
.stepper button{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:30px;font-weight:600}
.stepper .v{font-family:var(--f-display);font-size:72px;font-weight:800;width:110px;text-align:center;color:var(--felt)}
.hint{text-align:center;color:var(--muted);font-size:15px}

.fld{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px}
.fld input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;color:var(--ink);padding:8px 0}
.fld input:focus{outline:none}
.fld .seat{font-family:var(--f-display);font-weight:700;color:var(--muted);width:20px}
.tog{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tog.on{background:var(--felt);color:var(--felt-ink)}

.rrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.rrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rrow .h b{font-size:17px;min-width:0;overflow-wrap:anywhere}
.rrow .pv{font-size:13px;color:var(--muted);text-align:right}
.rrow .pv.o{color:var(--red);font-weight:700}.rrow .pv.z{color:var(--ok);font-weight:700}
.rrow .ctl{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.rrow input[type=number]{width:100%;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font:inherit;font-family:var(--f-display);font-size:22px;font-weight:700;padding:0 12px;color:var(--ink)}
.rrow input.miss{border-color:var(--red)}
.ib{width:52px;min-height:48px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;cursor:pointer}
.ib input{position:absolute;width:1px;height:1px;opacity:0}
.fin{font-size:14px;font-weight:600;color:var(--felt)}
.stat{font-size:13px;color:var(--muted)}

/* picker */
.ptotal{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ptotal .v{font-family:var(--f-display);font-size:48px;font-weight:800;color:var(--felt);line-height:1}
.ranks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rk{min-height:62px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rk b{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.1}
.rk span{font-size:12px;color:var(--muted)}
.rk.on{border-color:var(--felt);box-shadow:inset 0 0 0 1px var(--felt)}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qs button{min-height:56px;border-radius:12px;background:var(--surface);border:1px solid var(--felt);font-family:var(--f-display);font-size:20px;font-weight:700}
.qs button span{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600}
.picked{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.pc{min-height:40px;min-width:46px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-weight:700;font-size:16px}
.warn{font-size:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--ink)}

/* events overlay */
.ev{position:fixed;inset:0;z-index:80;background:#0b120e;color:#f2f6f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center;overflow-y:auto}
.ev .item{display:flex;flex-direction:column;gap:4px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.ev .item:nth-child(2){animation-delay:.15s}.ev .item:nth-child(3){animation-delay:.3s}
.ev .who{font-size:18px;opacity:.8}
.ev .nk{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,11vw,56px);line-height:1.05;color:#ff6b78;text-wrap:balance}
.ev .z .nk{color:#4fd18b}
.ev .th .nk{color:#e8bb4f;font-size:clamp(48px,16vw,84px);letter-spacing:-.02em}
.ev .tag{font-family:var(--f-display);font-size:18px;color:#e8bb4f;font-weight:700}
.ev .tap{font-size:13px;opacity:.55}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ev .item{animation:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;max-width:calc(100% - 32px)}
</style>

}
</script>

<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="picker-root"></div>
<div id="ev-root"></div>
<div id="toast-root"></div>
<script>
/* ---------- правила ---------- */
const RANKS=[
  {r:'6',l:'6',v:6},{r:'7',l:'7',v:7},{r:'8',l:'8',v:8},
  {r:'9',l:'9',v:0},{r:'10',l:'10',v:10},{r:'J',l:'В',v:2},
  {r:'Q',l:'Д',v:3},{r:'K',l:'К',v:4},{r:'A',l:'Т',v:11}];
const RV=Object.fromEntries(RANKS.map(x=>[x.r,x.v]));
const RL=Object.fromEntries(RANKS.map(x=>[x.r,x.l]));
const SUIT={s:'♠',c:'♣',h:'♥',d:'♦'};
const SUITN={s:'пики',c:'крести',h:'черви',d:'кирпич'};
const QBONUS={s:40,c:20,h:20,d:20};
const LIMIT=108;
// Любая карта по номиналу (дама = 3). Если на руке осталась ОДНА карта и это дама — бонус масти вместо 3: пики +40, остальные +20
const cardValue=c=>RV[c.r];
const handSum=cs=>cs.length===1&&cs[0].r==='Q'?(QBONUS[cs[0].s]||20):cs.reduce((a,c)=>a+cardValue(c),0);
const cardLabel=c=>(RL[c.r]||c.r)+(c.s?SUIT[c.s]:'');
const isRed=s=>s==='h'||s==='d';
const cardsFor=n=>n>=7?3:n>=5?4:5;
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c};

const NICKS={
 1:['Чайка','Осёл','Крыса','Таракан','Пельмень','Тапок','Бройлер','Хомяк в колесе','Сосиска','Картошка фри','Голубь с помойки','Сонная муха'],
 2:['Баран','Индюк','Утка','Курица','Ленивец','Сурок','Кабачок','Пингвин'],
 3:['Енот','Шакал','Скунс','Бобёр','Кабан','Барсук','Гиена'],
 4:['Халк','Шрек','Тор','Локи','Груут'],
 5:['Человек-паук','Бэтмен','Флэш','Робин'],
 6:['Железный человек','Капитан Америка','Супермен'],
 7:['Доктор Стрэндж','Чёрная пантера','Аквамен'],
 8:['Дэдпул','Росомаха','Джон Уик'],
 9:['Терминатор','Рэмбо','Брюс Ли']};
const WIN_NICK='Танос', WIN_TAG='Выигрыш есть — можно поесть';
function pickNick(place,used){const pool=NICKS[Math.min(place,9)];const free=pool.filter(n=>!used.includes(n));const a=free.length?free:pool;return a[Math.floor(Math.random()*a.length)]}

/* ---------- утилиты ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const nkey=name=>{let h=5381;const s=name.trim().toLowerCase();for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'n'+h.toString(16)};
const fmtDate=ts=>new Date(ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
function toast(msg){const r=$('#toast-root');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200)}

/* ---------- игровая логика ---------- */
const alive=t=>t.players.filter(p=>!p.out);
function nextDealer(t,fromId){
  const ps=t.players;let i=ps.findIndex(p=>p.id===fromId);
  for(let k=1;k<=ps.length;k++){const p=ps[(i+k+ps.length)%ps.length];if(!p.out)return p.id}
  return null;
}
function applyRound(t,deltas,finisher,fq){
  const before=clone(t.players);
  const act=alive(t);
  const final={},outNow=[],zero=[];
  for(const p of act){
    let d=p.id===finisher?(fq?-QBONUS[fq]:0):(Number(deltas[p.id])||0);
    final[p.id]=d;p.score+=d;
    if(p.score===LIMIT){p.score=0;zero.push(p.id)}
    else if(p.score>LIMIT)outNow.push(p);
  }
  let survivors=act.filter(p=>!outNow.includes(p));
  if(survivors.length===0&&outNow.length){ // вылетели все разом — побеждает тот, у кого меньше
    outNow.sort((a,b)=>a.score-b.score);survivors=[outNow.shift()];
  }
  outNow.sort((a,b)=>b.score-a.score);
  let place=t.players.filter(p=>p.out&&!p.left).length;
  const used=t.players.map(p=>p.nick).filter(Boolean);
  for(const p of outNow){place++;p.out=true;p.place=place;p.nick=pickNick(place,used);used.push(p.nick);p.outRound=t.rounds.length+1}
  const after={};for(const p of t.players)after[p.id]=p.score;
  const round={n:t.rounds.length+1,dealer:t.dealerId,deltas:final,finisher:finisher||null,fq:fq||null,before,after,outIds:outNow.map(p=>p.id),zeroIds:zero};
  t.rounds.push(round);
  if(survivors.length===1){
    const w=survivors[0];w.nick=WIN_NICK;t.status='done';t.winner={id:w.id,name:w.name};t.finishedAt=Date.now();
  }else t.dealerId=nextDealer(t,t.dealerId);
  t.updatedAt=Date.now();
  return round;
}
function undoRound(t){
  const r=t.rounds.pop();if(!r)return;
  // очки откатываем, но текущий порядом мест, ушедших и новичков сохраняем
  t.players=t.players.map(p=>{const b=r.before.find(x=>x.id===p.id);if(!b)return p;if(p.left)Object.assign(b,{out:true,left:true,leftRound:p.leftRound,nick:null,place:null});return b});
  t.dealerId=r.dealer;if(t.players.find(p=>p.id===t.dealerId)?.out)t.dealerId=nextDealer(t,t.dealerId);
  t.status='active';t.winner=null;t.finishedAt=null;t.updatedAt=Date.now();
}

const CFG=window.SCHET108_CONFIG||{};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function deviceId(){let id=LS.get('s108.device',null);if(!id){id='d'+rid();LS.set('s108.device',id)}return id}
function localStore(){
  const subs={tables:[],roster:[]};
  const read=c=>LS.get('s108.'+c,{});
  const emit=c=>{const arr=Object.entries(read(c)).map(([id,v])=>({id,...v}));
    arr.sort(c==='tables'?(a,b)=>b.createdAt-a.createdAt:(a,b)=>(b.lastUsed||0)-(a.lastUsed||0));
    subs[c].forEach(f=>f(arr,false))};
  addEventListener('storage',e=>{if(e.key==='s108.tables')emit('tables');if(e.key==='s108.roster')emit('roster')});
  const put=(c,id,v)=>{const m=read(c);if(v===null)delete m[id];else m[id]=v;LS.set('s108.'+c,m);emit(c)};
  return {mode:'local',async init(){return deviceId()},sub(c,f){subs[c].push(f);setTimeout(()=>emit(c))},
    async setTable(id,v){put('tables',id,v)},async deleteTable(id){put('tables',id,null)},async setRoster(id,v){put('roster',id,v)}};
}
function serverStore(){
  let ws,up=false,n=0;const uid=deviceId(),acks={},subs={tables:[],roster:[]};
  const mine=LS.get('s108.mine',{});
  const send=o=>new Promise((res,rej)=>{if(!ws||ws.readyState!==1)return rej(new Error('offline'));o.id=++n;acks[n]={res,rej};ws.send(JSON.stringify(o))});
  const keep=()=>{const k=Object.keys(mine);if(k.length>60)k.sort((a,b)=>(mine[a].createdAt||0)-(mine[b].createdAt||0)).slice(0,k.length-60).forEach(x=>delete mine[x]);LS.set('s108.mine',mine)};
  function open(){return new Promise((res,rej)=>{
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
    ws.onopen=()=>ws.send(JSON.stringify({t:'hello',uid}));
    ws.onmessage=e=>{const m=JSON.parse(e.data);
      if(m.t==='hello'){up=true;res()}
      else if(m.t==='snap'){subs[m.c].forEach(f=>f(m.items,false));
        if(m.c==='tables')Object.entries(mine).forEach(([id,v])=>{if(!m.items.some(x=>x.id===id))send({t:'set',c:'tables',key:id,v}).catch(()=>{})})}
      else if(m.t==='ack'){const a=acks[m.id];if(a){delete acks[m.id];m.err?a.rej(new Error(m.err)):a.res()}}};
    ws.onerror=()=>{if(!up)rej(new Error('ws'))};
    ws.onclose=()=>{for(const k in acks){acks[k].rej(new Error('closed'));delete acks[k]}if(up)setTimeout(()=>open().catch(()=>{}),2000);else rej(new Error('ws'))}})}
  return {mode:'cloud',async init(){await open();return uid},sub(c,f){subs[c].push(f)},
    async setTable(id,v){if(v.creator===uid){mine[id]=v;keep()}return send({t:'set',c:'tables',key:id,v})},
    async deleteTable(id){delete mine[id];keep();return send({t:'del',key:id})},
    setRoster:(id,v)=>send({t:'set',c:'roster',key:id,v})};
}
function firebaseStore(conf){
  let fs;
  return {mode:'cloud',
    async init(){firebase.initializeApp(conf);fs=firebase.firestore();try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch{}
      const c=await firebase.auth().signInAnonymously();return c.user.uid},
    sub(c,f){const q=c==='tables'?fs.collection('tables').orderBy('createdAt','desc').limit(200):fs.collection('roster').orderBy('lastUsed','desc').limit(100);
      q.onSnapshot({includeMetadataChanges:true},s=>f(s.docs.map(d=>({id:d.id,...d.data()})),s.metadata.fromCache),e=>f(null,false,e))},
    setTable:(id,v)=>fs.collection('tables').doc(id).set(v),
    deleteTable:id=>fs.collection('tables').doc(id).delete(),
    setRoster:(id,v)=>fs.collection('roster').doc(id).set(v)};
}

  readHash();render();

  catch(e){console.error(e);toast('Сервер не подключился — работаю только на этом телефоне');store=localStore();S.myId=await store.init()}
  S.mode=store.mode;S.db=store;S.isOwner=S.mode==='local';S.canWrite=true;
  S.apiKey=LS.get('s108.apikey','');S.canPhoto=!!S.apiKey;
  const timer=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
  store.sub('tables',(arr,fromCache,err)=>{
    if(err){clearTimeout(timer);S.loaded=true;S.slow=true;render();return}
    S.tables=arr;S.loaded=true;if(!fromCache){clearTimeout(timer);S.slow=false}
    checkEvents();render();if(R&&R.kind==='round'&&!getT(R.tid))closeSheet();
  });
  store.sub('roster',arr=>{if(arr)S.roster=arr});
}
function checkEvents(){
  for(const t of S.tables){
    const n=(t.rounds||[]).length;
    if(!(t.id in seen)){seen[t.id]=n;continue}
    if(n>seen[t.id]&&S.view==='table'&&S.tid===t.id){
      const r=t.rounds[n-1];
      if(r.outIds?.length||r.zeroIds?.length||t.status==='done')showEvents(t,r);
    }
    seen[t.id]=n;
  }
}

  sheet('Новый игрок',`<p class="note">Зайдёт с <b class="num">${start}</b> — максимум среди тех, кто в игре. Сядет последним по кругу.</p>
    <div class="fld"><input id="add-nm" placeholder="Имя" maxlength="24" autocomplete="off" oninput="R.name=this.value"></div>
    ${S.roster.length?`<div class="chips">${S.roster.filter(r=>!have.includes(r.name.toLowerCase())).map(r=>`<button class="chip" onclick="$('#add-nm').value=R.name=${esc(JSON.stringify(r.name))}">${esc(r.name)}</button>`).join('')}</div>`:''}`,
    `<button class="btn primary block" onclick="addPlayer(${start})">Добавить в игру</button>`);
}
async function addPlayer(start){
  const nm=(R.name||'').trim();const t=clone(getT(S.tid));
  if(!nm)return toast('Впишите имя');
  if(t.players.some(p=>p.name.toLowerCase()===nm.toLowerCase()))return toast('Такое имя уже за столом');
  t.players.push({id:rid(),name:nm,score:start,out:false,place:null,nick:null,outRound:null,joined:t.rounds.length+1});
  t.updatedAt=Date.now();closeSheet();upsertLocal(t);render();await saveT(t);
  store.setRoster(nkey(nm),{name:nm,lastUsed:Date.now()}).catch(()=>{});
  toast(nm+' в игре с '+start);
}

/* сменить сдающего */
function openDealer(){
  const t=getT(S.tid);R={kind:'dealer'};
  sheet('Кто раздаёт сейчас?',`<div class="chips">${alive(t).map(p=>`<button class="chip ${p.id===t.dealerId?'on':''}" onclick="setDealer('${p.id}')">${esc(p.name)}</button>`).join('')}</div>`);
}
/* пересадка и уход */
function openSeats(){const t=getT(S.tid);R={kind:'seats',order:alive(t).map(p=>p.id),rm:[]};renderSeats()}
function renderSeats(){
  const t=getT(S.tid);const by=id=>t.players.find(p=>p.id===id);const n=R.order.length;
  const stay=R.order.filter(id=>!R.rm.includes(id)).length;
  sheet('Пересадка и уход',`<p class="note">Порядок — по часовой стрелке. Стрелками переставьте тех, кто пересел, кнопкой «уходит» отметьте тех, кто заканчивает игру.</p>
    <div class="list">${R.order.map((id,i)=>{const p=by(id),g=R.rm.includes(id);return `<div class="srow ${g?'gone':''}"><span class="seat num">${i+1}</span><span class="sn"><span>${esc(p.name)}</span><small class="num">${p.score} очк.${id===t.dealerId?' · сдаёт':''}</small></span>
      <button class="ar" ${i===0?'disabled':''} onclick="mvSeat(${i},-1)" aria-label="Выше">↑</button><button class="ar" ${i===n-1?'disabled':''} onclick="mvSeat(${i},1)" aria-label="Ниже">↓</button>
      <button class="tog ${g?'rm':''}" onclick="tgLeave('${id}')">${g?'уходит':'уходит?'}</button></div>`}).join('')}</div>
    ${stay<2?'<div class="warn">В игре должны остаться минимум двое.</div>':''}
    ${R.rm.length?`<p class="note">Ушедшие останутся в истории стола, но без места и прозвища. Раздача на ${stay}: по ${cardsFor(stay)} ${plural(cardsFor(stay),'карте','карты','карт')}.</p>`:''}`,
    `<button class="btn primary block" ${stay<2?'disabled':''} onclick="saveSeats()">Сохранить</button>`);
}
function mvSeat(i,d){const j=i+d;if(j<0||j>=R.order.length)return;[R.order[i],R.order[j]]=[R.order[j],R.order[i]];renderSeats()}
function tgLeave(id){R.rm=R.rm.includes(id)?R.rm.filter(x=>x!==id):[...R.rm,id];renderSeats()}
async function saveSeats(){
  const t=clone(getT(S.tid));const n=R.order.length;
  if(R.order.filter(id=>!R.rm.includes(id)).length<2)return;
  if(R.rm.includes(t.dealerId)){const i=R.order.indexOf(t.dealerId);for(let k=1;k<=n;k++){const id=R.order[(i+k)%n];if(!R.rm.includes(id)){t.dealerId=id;break}}}
  const seated=R.order.map(id=>t.players.find(p=>p.id===id));
  for(const p of seated)if(R.rm.includes(p.id))Object.assign(p,{out:true,left:true,leftRound:t.rounds.length,nick:null,place:null});
  t.players=[...seated,...t.players.filter(p=>!R.order.includes(p.id))];
  t.updatedAt=Date.now();const gone=R.rm.length;closeSheet();upsertLocal(t);render();await saveT(t);
  toast(gone?`Состав обновлён · ушли: ${gone}`:'Места обновлены');
}
async function setDealer(id){const t=clone(getT(S.tid));t.dealerId=id;t.updatedAt=Date.now();closeSheet();upsertLocal(t);render();await saveT(t)}

/* ---------- запись раунда ---------- */
function openRound(){R={kind:'round',tid:S.tid,deltas:{},cards:{},finisher:null,fq:null,status:{}};renderRound()}
function renderRound(){
  const t=getT(R.tid);const al=alive(t);
  let b=`<div class="list"><h2>Кто закрыл раунд</h2><div class="chips">${al.map(p=>`<button class="chip ${R.finisher===p.id?'on':''}" onclick="R.finisher=R.finisher==='${p.id}'?null:'${p.id}';R.fq=null;renderRound()">${esc(p.name)}</button>`).join('')}</div></div>`;
  if(R.finisher){
    b+=`<div class="list"><h2>Последняя карта</h2><div class="chips"><button class="chip ${!R.fq?'on':''}" onclick="R.fq=null;renderRound()">Обычная · 0</button>${['s','c','h','d'].map(s=>`<button class="chip q ${R.fq===s?'on':''}" onclick="R.fq='${s}';renderRound()">Д<span class="${isRed(s)?'rd':''}">${SUIT[s]}</span> −${QBONUS[s]}</button>`).join('')}</div></div>`;
  }
  b+=`<div class="list"><h2>Очки на руках</h2>`;
  for(const p of al){
    if(p.id===R.finisher){
      b+=`<div class="rrow"><div class="h"><b>${esc(p.name)}</b><span class="pv" id="pv-${p.id}"></span></div><span class="fin">Закрыл раунд: ${R.fq?'−'+QBONUS[R.fq]+' за даму '+SUITN[R.fq]:'0 очков'}</span></div>`;
    }else{
      const v=R.deltas[p.id]??'';const cs=R.cards[p.id];
      b+=`<div class="rrow"><div class="h"><b>${esc(p.name)}</b><span class="pv" id="pv-${p.id}"></span></div>
      <div class="ctl"><input type="number" inputmode="numeric" id="in-${p.id}" value="${v}" placeholder="0" oninput="setDelta('${p.id}',this.value)" aria-label="Очки ${esc(p.name)}">
      <button class="ib" onclick="openPicker('${p.id}')" aria-label="Посчитать по картам">🃏</button>
      ${S.canPhoto?`<label class="ib" aria-label="Сфотографировать карты">📷<input type="file" accept="image/*" capture="environment" id="ph-${p.id}" onchange="photo('${p.id}',this)"></label>`:''}</div>
      ${cs?.length?`<span class="stat">${cs.map(cardLabel).join(' ')}</span>`:''}<span class="stat" id="st-${p.id}">${esc(R.status[p.id]||'')}</span></div>`;
    }
  }
  b+=`</div>`;
  sheet(`Раунд ${t.rounds.length+1}`,b,`<div class="note" id="rd-err"></div><button class="btn primary block" id="rd-go" onclick="saveRound()">Сохранить раунд</button>`);
  for(const p of al)preview(p.id);validRound();
}
function setDelta(pid,v){R.deltas[pid]=v;delete R.cards[pid];preview(pid);validRound()}
function preview(pid){
  const t=getT(R.tid);const p=t.players.find(x=>x.id===pid);const el=$('#pv-'+pid);if(!el||!p)return;
  let d=pid===R.finisher?(R.fq?-QBONUS[R.fq]:0):Number(R.deltas[pid]);
  if(pid!==R.finisher&&(R.deltas[pid]===''||R.deltas[pid]==null)){el.className='pv';el.textContent=`сейчас ${p.score}`;return}
  const n=p.score+(d||0);
  el.className='pv'+(n===LIMIT?' z':n>LIMIT?' o':'');
  el.textContent=n===LIMIT?`${p.score} → ровно 108 → 0!`:n>LIMIT?`${p.score} → ${n} · вылет`:`${p.score} → ${n}`;
}
function validRound(){
  const t=getT(R.tid);const miss=alive(t).filter(p=>p.id!==R.finisher&&(R.deltas[p.id]===''||R.deltas[p.id]==null||isNaN(Number(R.deltas[p.id]))));
  for(const p of alive(t)){const i=$('#in-'+p.id);if(i)i.classList.toggle('miss',miss.includes(p)&&R.touched)}
  const e=$('#rd-err'),b=$('#rd-go');if(!b)return false;
  e.textContent=miss.length?'Не заполнено: '+miss.map(p=>p.name).join(', '):'';
  b.disabled=!!miss.length;return !miss.length;
}
async function saveRound(){
  R.touched=true;if(!validRound())return;
  const t=clone(getT(R.tid));
  applyRound(t,R.deltas,R.finisher,R.fq);
  closeSheet();upsertLocal(t);render();
  const r=t.rounds[t.rounds.length-1];
  if(r.outIds.length||r.zeroIds.length||t.status==='done')showEvents(t,r);
  seen[t.id]=t.rounds.length;
  await saveT(t);
}

/* ---------- подсчёт по картам ---------- */
let P=null;
function openPicker(pid,cards,note){P={pid,cards:cards||clone(R.cards[pid]||[]),q:false,note:note||''};renderPicker()}
function renderPicker(){
  const t=getT(R.tid);const p=t.players.find(x=>x.id===P.pid);
  const sum=handSum(P.cards);
  $('#picker-root').innerHTML=`<div class="sheet-wrap" style="z-index:60" onclick="if(event.target===this)closePicker()"><div class="sheet" role="dialog" aria-label="Карты"><header><h3>Карты: ${esc(p.name)}</h3><button class="x" onclick="closePicker()" aria-label="Закрыть">✕</button></header>
  <div class="body">
    ${P.note?`<div class="warn">${esc(P.note)}</div>`:''}
    <div class="ptotal"><span class="muted">${P.cards.length} ${plural(P.cards.length,'карта','карты','карт')}</span><span class="v num">${sum}</span></div>
    <div class="picked">${P.cards.length?P.cards.map((c,i)=>`<button class="pc ${isRed(c.s)?'rd':''}" onclick="P.cards.splice(${i},1);renderPicker()" aria-label="Убрать ${cardLabel(c)}">${cardLabel(c)}</button>`).join(''):'<span class="note">Нажимайте на карты, которые остались на руках. Тап по карте сверху — убрать.</span>'}</div>
    ${P.q?`<div class="list"><h2>Какая дама?</h2><div class="qs">${['s','c','h','d'].map(s=>`<button onclick="P.cards.push({r:'Q',s:'${s}'});P.q=false;renderPicker()"><span class="${isRed(s)?'rd':''}">Д${SUIT[s]}</span><span>одна: +${QBONUS[s]}</span></button>`).join('')}</div></div>`:''}
    <div class="ranks">${RANKS.map(x=>`<button class="rk ${x.r==='Q'&&P.q?'on':''}" onclick="${x.r==='Q'?'P.q=!P.q':`P.cards.push({r:'${x.r}'})`};renderPicker()"><b>${x.l}</b><span>${x.r==='Q'?'+ масть':x.v+' очк.'}</span></button>`).join('')}</div>
    <p class="note">Дама — 3 очка. Если на руке осталась только одна дама: пиковая +40, остальные +20.</p>
  </div>
  <footer><button class="btn primary block" onclick="pickerDone()">Готово · ${sum}</button><button class="btn block" onclick="P.cards=[];renderPicker()">Очистить</button></footer></div></div>`;
}
function closePicker(){$('#picker-root').innerHTML='';P=null}
function pickerDone(){
  const sum=handSum(P.cards);
  R.deltas[P.pid]=String(sum);R.cards[P.pid]=P.cards;R.status[P.pid]='';closePicker();renderRound();
}

/* ---------- фото → очки ---------- */
const PHOTO_PROMPT=`На фото игральные карты из колоды 36 карт (6, 7, 8, 9, 10, валет, дама, король, туз). Перечисли КАЖДУЮ карту, которую видно на фото, ровно по одному разу. Если карты лежат веером и перекрываются — считай каждую по видимому углу.
Ответь только JSON: {"cards":[{"r":"6|7|8|9|10|J|Q|K|A","s":"s|c|h|d"}],"unsure":false}
r: J = валет (В), Q = дама (Д), K = король (К), A = туз (Т).
s: s = пики ♠, c = трефы/крести ♣, h = черви ♥, d = бубны/кирпич ♦.
unsure = true, если какие-то карты разглядеть не удалось.`;
async function photo(pid,input){
  const f=input.files?.[0];input.value='';if(!f)return;
  const st=$('#st-'+pid);R.status[pid]='Считаю карты на фото…';if(st)st.textContent=R.status[pid];
  try{
    const res=await visionCards(f);
    const cards=(res?.cards||[]).map(c=>({r:String(c.r).toUpperCase(),s:String(c.s||'').toLowerCase()}))
      .filter(c=>c.r in RV).map(c=>c.r==='Q'?{r:'Q',s:SUIT[c.s]?c.s:'c'}:{r:c.r});
    R.status[pid]='';if(st)st.textContent='';
    if(!R||R.kind!=='round')return;
    openPicker(pid,cards,cards.length?`Распознано ${cards.length} ${plural(cards.length,'карта','карты','карт')}${res?.unsure?' — часть не разглядеть':''}. Проверьте и поправьте, если нужно.`:'На фото не нашёл карт. Добавьте вручную или переснимите.');
  }catch(e){
    const m={bad_key:'Ключ API не подошёл — проверьте его в настройках',no_key:'Добавьте ключ API в настройках',not_granted:'Фото-подсчёт не разрешён — считайте тапами по картам',rate_limited:'Слишком много фото подряд — подождите минуту',image_rejected:'Фото не подошло — переснимите',refused:'Не удалось распознать — переснимите',invalid_json:'Не разобрал карты — переснимите ближе'}[e?.code]||'Не получилось распознать — попробуйте ещё раз';
    R&&(R.status[pid]=m);if(st)st.textContent=m;
    
  }
}

async function visionCards(file){
  if(!S.apiKey)throw {code:'no_key'};
  // уменьшаем фото до 1568px по длинной стороне — быстрее и дешевле
  const bmp=await createImageBitmap(file);const k=Math.min(1,1568/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const b64=cv.toDataURL('image/jpeg',.85).split(',')[1];
  let r;
  try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:CFG.visionModel||'claude-sonnet-5-5',max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:PHOTO_PROMPT}]}]})})}
  catch{throw {code:'upstream'}}
  if(!r.ok)throw {code:r.status===401||r.status===403?'bad_key':r.status===429?'rate_limited':'upstream'};
  const j=await r.json();const txt=(j.content||[]).map(c=>c.text||'').join('');
  const m=txt.match(/\{[\s\S]*\}/);if(!m)throw {code:'invalid_json'};
  try{return JSON.parse(m[0])}catch{throw {code:'invalid_json'}}
}

/* ---------- настройки ---------- */
function openSettings(){
  R={kind:'set'};
  sheet('Настройки',`<div class="list"><h2>Где хранится счёт</h2><p class="note">${S.mode==='cloud'?'Общий сервер: столы видны на всех телефонах, где открыто приложение. Записывать очки может только создатель стола.':'Только этот телефон: столы хранятся в памяти браузера и работают без интернета. Чтобы друзья видели столы, включите общий сервер — инструкция в README.'}</p></div>
    <div class="list"><h2>Фото-подсчёт</h2><p class="note">Нужен ключ Anthropic API. Он хранится только на этом телефоне и уходит только в Anthropic. Без ключа считайте тапами по картам.</p>
    <div class="fld"><input id="api-key" type="password" placeholder="sk-ant-..." value="${esc(S.apiKey||'')}" autocomplete="off"></div></div>`,
    `<button class="btn primary block" onclick="saveSettings()">Сохранить</button>`);
}
function saveSettings(){S.apiKey=$('#api-key').value.trim();LS.set('s108.apikey',S.apiKey);S.canPhoto=!!S.apiKey;closeSheet();render();toast(S.canPhoto?'Фото-подсчёт включён':'Фото-подсчёт выключен')}

/* ---------- вылет / Танос ---------- */
function showEvents(t,r){
  const by=id=>t.players.find(p=>p.id===id);
  let items='';
  for(const id of r.zeroIds||[]){const p=by(id);if(p)items+=`<div class="item z"><span class="who">${esc(p.name)} набрал ровно 108</span><span class="nk">Обнулился!</span></div>`}
  for(const id of r.outIds||[]){const p=by(id);if(p)items+=`<div class="item"><span class="who">${esc(p.name)} выбыл · ${p.place}-м</span><span class="nk">${esc(p.nick||'')}</span></div>`}
  if(t.status==='done'&&t.winner&&r===t.rounds[t.rounds.length-1])items+=`<div class="item th"><span class="who">Победитель — ${esc(t.winner.name)}</span><span class="nk">${WIN_NICK}</span><span class="tag">${esc(WIN_TAG)}</span></div>`;
  if(!items)return;
  $('#ev-root').innerHTML=`<div class="ev" role="dialog" onclick="this.remove()">${items}<span class="tap">Нажмите, чтобы продолжить</span></div>`;
}

init();

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
